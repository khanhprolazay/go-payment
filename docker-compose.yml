services:
  database:
    image: postgres:17-alpine
    container_name: payment_database
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payment
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment"]
      interval: 5s
      timeout: 3s
      retries: 10

  cache:
    image: redis:8-alpine
    container_name: payment_cache
    ports:
      - "6379:6379"

  event_store:
    image: nats:2.11-alpine
    container_name: payment_event_store
    command: ["- js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  pgdata: